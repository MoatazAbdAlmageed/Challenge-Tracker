<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Challenge Tracker</title>
  <link rel="stylesheet" href="popup.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <header>
      <h1>Challenge Tracker</h1>
      <button id="add-btn" title="Add New Challenge">+</button>
    </header>

    <main id="app-content">
      <!-- Challenge List View -->
      <div id="list-view" class="view">
        <div id="challenges-container">
          <div class="empty-state">
            <p>No challenges yet. Start by creating one!</p>
          </div>
        </div>
      </div>

      <!-- Create Challenge View -->
      <div id="create-view" class="view hidden">
        <div class="card">
          <h2>New Challenge</h2>
          <div class="form-group">
            <label for="title-input">Challenge Name</label>
            <input type="text" id="title-input" placeholder="e.g., 30 Days of Code">
          </div>
          <div class="form-group">
            <label for="category-input">Category</label>
            <input type="text" id="category-input" list="categories" placeholder="e.g., Fitness, Coding, Health">
            <datalist id="categories">
              <option value="Personal">
              <option value="Work">
              <option value="Fitness">
              <option value="Learning">
              <option value="Health">
              <option value="Hobbies">
            </datalist>
          </div>
          <div class="date-row">
            <div class="form-group">
              <label for="start-date">Start Date</label>
              <input type="date" id="start-date">
            </div>
            <div class="form-group">
              <label for="end-date">End Date</label>
              <input type="date" id="end-date">
            </div>
          </div>
          <div class="actions">
            <button id="cancel-create" class="secondary">Cancel</button>
            <button id="save-challenge" class="primary">Save Challenge</button>
          </div>
        </div>
      </div>

      <!-- Detail View -->
      <div id="detail-view" class="view hidden">
        <div class="detail-header">
          <button id="back-to-list" class="icon-btn">←</button>
          <div>
            <h2 id="current-title" style="margin-bottom: 2px;">Challenge Title</h2>
            <span id="current-category" class="category-badge">Category</span>
          </div>
        </div>
        
        <div class="stats-bar">
          <div class="progress-container">
            <div id="progress-bar" style="width: 0%;"></div>
          </div>
          <span id="progress-text">0/0 Completed</span>
        </div>

        <div id="table-container">
          <!-- Table will be injected here -->
        </div>

        <div class="detail-actions">
          <button id="share-progress" class="primary">Share Progress</button>
          <button id="copy-summary" class="secondary">Copy Summary</button>
          <button id="reset-challenge" class="danger">Reset</button>
          <button id="delete-challenge" class="danger-outline">Delete</button>
        </div>
      </div>
    </main>

    <div id="toast" class="toast hidden">Copied to clipboard!</div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
